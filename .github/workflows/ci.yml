# Continuous integration: the merge gate for every pull request into main.
# Production deployment is handled separately (see docs/DEPLOYMENT.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Colombo

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: verify
    env:
      TZ: Asia/Colombo

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @stopwash/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  container:
    name: API container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: verify
    env:
      TZ: Asia/Colombo

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -f apps/api/Dockerfile -t stopwash-api:ci .

      - name: Smoke test
        run: |
          docker run -d --name api -p 8080:8080 \
            -e NODE_ENV=development -e DATA_BACKEND=memory -e DEV_SEED=false \
            -e FIREBASE_PROJECT_ID=demo-stopwash -e LOG_LEVEL=info stopwash-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
